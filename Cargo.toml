[package]
name = "sqlite-workbench"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "A native SQLite data workbench built with GPUI Kit"
publish = false

[dependencies]
gpui-kit = "0.7.0"
rusqlite = { version = "0.38", features = ["bundled"] }
dirs = "6"
tempfile = "3"
thiserror = "2"

[dev-dependencies]
gpui-kit = { version = "0.7.0", features = ["test-support"] }

[target.'cfg(unix)'.dev-dependencies]
libc = "0.2"